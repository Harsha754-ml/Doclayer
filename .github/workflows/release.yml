name: Build and Release MSI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset (v4)
        run: |
          dotnet tool install --global wix --version 4.0.5
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish application (self-contained, win-x64)
        run: |
          dotnet publish WordBarcodeStudio.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Harvest application files into a WiX fragment
        run: |
          wix heat dir publish `
            -o installer\Components.wxs `
            -nologo -gg -sreg -scom -srd `
            -dr INSTALLFOLDER -cg AppFiles

      - name: Build MSI
        run: |
          dotnet build installer\Doclayer.Installer.wixproj -c Release `
            -p:DefineConstants=ProductVersion=${{ steps.version.outputs.version }}

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doclayer-${{ steps.version.outputs.version }}
          path: installer\bin\Release\*.msi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Doclayer ${{ steps.version.outputs.version }}
          files: installer\bin\Release\*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

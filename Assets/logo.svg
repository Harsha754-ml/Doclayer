<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>DocLayer Logo Mark</title>
  <desc>Flat layered document mark forming a stylized D.</desc>

  <!-- Back document layer -->
  <path d="M30 70 Q30 56 44 56 H86 V206 H44 Q30 206 30 192 Z" fill="#3B82F6"/>

  <!-- Middle document layer -->
  <path d="M46 54 Q46 40 60 40 H104 V220 H60 Q46 220 46 206 Z" fill="#2563EB"/>

  <!-- Main D/document body -->
  <path d="M74 28 H144
           C193 28 226 66 226 128
           C226 190 193 228 144 228
           H74
           Q60 228 60 214
           V42
           Q60 28 74 28 Z"
        fill="#0F2747"/>

  <!-- Inner page cutout -->
  <path d="M86 50 H141
           C174 50 202 79 202 128
           C202 177 174 206 141 206
           H86
           V50 Z"
        fill="#FFFFFF"/>

  <!-- Fold edge / page notch -->
  <path d="M141 50 L174 83 H155
           Q141 83 141 69 Z"
        fill="#E8EEF7"/>

  <!-- Document content block -->
  <rect x="99" y="95" width="30" height="30" rx="4" fill="#2563EB"/>

  <rect x="140" y="99" width="36" height="7" rx="3.5" fill="#0F2747"/>
  <rect x="140" y="112" width="29" height="7" rx="3.5" fill="#0F2747"/>

  <rect x="99" y="139" width="77" height="7" rx="3.5" fill="#0F2747"/>
  <rect x="99" y="153" width="50" height="7" rx="3.5" fill="#0F2747"/>

  <!-- Layer separator -->
  <rect x="46" y="214" width="69" height="6" rx="3" fill="#FFFFFF" opacity="0.96"/>
</svg>
